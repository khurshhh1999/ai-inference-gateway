openapi: 3.1.0
info:
  title: AI Inference Gateway
  version: 0.4.0
  description: OpenAI-shaped chat completions edge for multi-cloud LLM routing.
servers:
  - url: http://localhost:18080
paths:
  /health:
    get:
      summary: Gateway health
      responses:
        "200":
          description: OK
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CacheBypass"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/chat-completion.request.json"
      responses:
        "200":
          description: |
            JSON completion when `stream` is false/omitted.
            When `stream` is true, OpenAI-shaped SSE (`text/event-stream`) with
            `chat.completion.chunk` events ending in `data: [DONE]`.
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing or invalid API key
        "502":
          description: Upstream router / provider error
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Tenant namespace for the semantic cache (default "default")
      schema:
        type: string
        default: default
    CacheBypass:
      name: X-Cache-Bypass
      in: header
      required: false
      description: Set to "1" to skip semantic cache read/write
      schema:
        type: string
        enum: ["1", "true"]
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
