openapi: 3.1.0
info:
  title: AI Inference Gateway
  version: 0.15.0
  description: |
    OpenAI-shaped edge for multi-cloud LLM routing with chat completions
    (including tool / function calling), model listing, embeddings, semantic
    cache, streaming, budgets, rate limiting, tracing, adaptive routing, hedged
    requests, and indexed vector lookup.
servers:
  - url: http://localhost:18080
paths:
  /health:
    get:
      summary: Gateway health
      responses:
        "200":
          description: OK
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition format
  /openapi.json:
    get:
      summary: OpenAPI document
      responses:
        "200":
          description: OpenAPI 3.1 JSON
  /docs:
    get:
      summary: Swagger UI
      responses:
        "200":
          description: HTML docs
  /v1/models:
    get:
      summary: List models
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: OpenAI-shaped `{ object: list, data: [model] }` catalog
        "401":
          description: Missing or invalid API key
        "429":
          description: Gateway per-key/per-tenant rate limit exceeded
        "502":
          description: Upstream router error
  /v1/models/{model}:
    get:
      summary: Retrieve a model
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Model object
        "401":
          description: Missing or invalid API key
        "404":
          description: Unknown model id
        "429":
          description: Gateway rate limit exceeded
  /v1/embeddings:
    post:
      summary: Create embeddings
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/embeddings.request.json"
      responses:
        "200":
          description: |
            OpenAI-shaped embedding list. Uses the same local embedder as the
            semantic cache (`CACHE_EMBEDDING_PROVIDER`). Every response includes
            `X-Request-Id`.
        "400":
          description: Invalid body or a non-embedding model id
        "401":
          description: Missing or invalid API key
        "402":
          description: Tenant hard USD/token budget exhausted
        "413":
          description: Request body exceeds MAX_BODY_BYTES
        "429":
          description: Gateway rate limit exceeded
        "502":
          description: Upstream router error
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CacheBypass"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/chat-completion.request.json"
      responses:
        "200":
          description: |
            JSON completion when `stream` is false/omitted.
            When `stream` is true, OpenAI-shaped SSE (`text/event-stream`) with
            `chat.completion.chunk` events ending in `data: [DONE]`.
            Tool calls use OpenAI `tools` / `tool_choice`; `finish_reason` may
            be `tool_calls` and assistant messages may include `tool_calls`.
            Soft budget warnings may include header `X-Budget-Warning: soft`.
            Rate-limited responses include `X-RateLimit-*` and may include `Retry-After`.
            Every response includes `X-Request-Id` for log/trace correlation.
          content:
            application/json:
              schema:
                type: object
                description: |
                  OpenAI-shaped completion plus gateway fields `provider`,
                  `route_reason`, and `cached` (used to prove live Bedrock vs mock).
                properties:
                  id:
                    type: string
                  provider:
                    type: string
                    description: Adapter name (mock | bedrock | vertex)
                  route_reason:
                    type: string
                    nullable: true
                    description: >
                      Why this provider was chosen (cost, latency, affinity,
                      failover, adaptive, hedged, cache_hit).
                  cached:
                    type: boolean
                  choices:
                    type: array
                    items:
                      type: object
                  usage:
                    type: object
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid API key
        "402":
          description: Tenant hard USD/token budget exhausted (configurable as 429)
        "413":
          description: Request body exceeds MAX_BODY_BYTES
        "429":
          description: |
            Gateway per-key/per-tenant rate limit exceeded, or tenant hard budget
            exhausted when BUDGET_HARD_STATUS=429.
        "502":
          description: Upstream router / provider error
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Tenant namespace for cache + budgets when calling the router directly.
        On the gateway, tenant is derived from the API key (`TENANT_API_KEYS`)
        and client-supplied X-Tenant-Id is ignored.
      schema:
        type: string
        default: default
    CacheBypass:
      name: X-Cache-Bypass
      in: header
      required: false
      description: Set to "1" to skip semantic cache read/write
      schema:
        type: string
        enum: ["1", "true"]
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Optional correlation id echoed on the response and attached to
        OpenTelemetry spans. Generated when omitted or invalid.
      schema:
        type: string
        maxLength: 128
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Maps to a tenant via TENANT_API_KEYS (or DEMO_API_KEY → tenant "default").
        `Authorization: Bearer <key>` is accepted as an alias.
    BearerAuth:
      type: http
      scheme: bearer
      description: Same secret as X-API-Key (OpenAI client default).
