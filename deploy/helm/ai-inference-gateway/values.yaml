# Default: mock providers — safe for kind / local demos (no cloud keys).

replicaCount:
  gateway: 1
  router: 1

image:
  gateway:
    repository: ai-gateway
    tag: local
    pullPolicy: IfNotPresent
  router:
    repository: ai-router
    tag: local
    pullPolicy: IfNotPresent

service:
  gateway:
    type: NodePort
    port: 8080
    nodePort: 30080
  router:
    type: ClusterIP
    port: 8081

redis:
  enabled: true
  # Redis 8 ships Query Engine (RediSearch). Use redis:7-alpine + scan if needed.
  image: redis:8-alpine
  port: 6379

auth:
  # Override via --set or a sealed secret in real clusters
  demoApiKey: demo-key-change-me

gateway:
  redisUrl: redis://redis:6379/0
  rateLimitEnabled: "true"
  rateLimitBackend: redis
  rateLimitKeyQps: "10"
  rateLimitKeyBurst: "20"
  rateLimitTenantQps: ""
  rateLimitTenantBurst: ""

router:
  providerMode: mock
  # failover | prefer_cost | prefer_latency | prefer_provider | adaptive
  routingPolicy: failover
  routingPrimary: bedrock
  routingFallback: "vertex,mock"
  cacheEnabled: "true"
  cacheIndexBackend: auto
  cacheEmbeddingProvider: hashing
  cacheAnnTopK: "25"
  budgetEnabled: "true"
  redisUrl: redis://redis:6379/0
  adaptiveEwmaAlpha: "0.3"
  adaptiveErrorPenaltyMs: "1000"
  adaptiveStaleAfterSeconds: "30"
  modelMap: >-
    gpt-proxy=bedrock:anthropic.claude-3-haiku-20240307-v1:0,vertex:gemini-1.5-flash;mock-small=mock:mock-small
  # Optional cloud — leave empty for mock demos
  awsRegion: ""
  googleCloudProject: ""
  googleCloudLocation: us-central1

resources:
  gateway:
    requests:
      cpu: 50m
      memory: 64Mi
  router:
    requests:
      cpu: 100m
      memory: 128Mi
