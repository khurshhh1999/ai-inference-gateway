apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "ai-inference-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.gateway.repository }}:{{ .Values.image.gateway.tag }}"
          imagePullPolicy: {{ .Values.image.gateway.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ROUTER_URL
              value: http://router:{{ .Values.service.router.port }}
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-inference-gateway.fullname" . }}-auth
                  key: DEMO_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "ai-inference-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.gateway.type }}
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.gateway.port }}
      targetPort: 8080
      {{- if and (eq .Values.service.gateway.type "NodePort") .Values.service.gateway.nodePort }}
      nodePort: {{ .Values.service.gateway.nodePort }}
      {{- end }}
