services:
  redis:
    # Redis 8 includes Query Engine (RediSearch) so CACHE_INDEX_BACKEND=auto can
    # use HNSW KNN. Vanilla Redis 7 still works: the router falls back to scan.
    image: ${REDIS_IMAGE:-redis:8-alpine}
    # Not published to the host by default (avoids clashing with other local Redis).
    # Use `docker compose exec redis redis-cli` for debugging, or add "6380:6379".
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  router:
    build:
      context: ./apps/router
    ports:
      - "${ROUTER_HOST_PORT:-18081}:8081"
    environment:
      PROVIDER_MODE: ${PROVIDER_MODE:-mock}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8081"
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-40}
      ROUTING_POLICY: ${ROUTING_POLICY:-failover}
      ROUTING_PRIMARY: ${ROUTING_PRIMARY:-bedrock}
      ROUTING_FALLBACK: ${ROUTING_FALLBACK:-vertex,mock}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-5000}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      CIRCUIT_BREAKER_RESET_MS: ${CIRCUIT_BREAKER_RESET_MS:-30000}
      PROVIDER_COST_PER_1K_INPUT: ${PROVIDER_COST_PER_1K_INPUT:-mock:0.0,bedrock:0.00025,vertex:0.000075}
      PROVIDER_COST_PER_1K_OUTPUT: ${PROVIDER_COST_PER_1K_OUTPUT:-mock:0.0,bedrock:0.00125,vertex:0.0003}
      PROVIDER_LATENCY_MS: ${PROVIDER_LATENCY_MS:-mock:40,bedrock:200,vertex:150}
      ADAPTIVE_EWMA_ALPHA: ${ADAPTIVE_EWMA_ALPHA:-0.3}
      ADAPTIVE_ERROR_PENALTY_MS: ${ADAPTIVE_ERROR_PENALTY_MS:-1000}
      ADAPTIVE_MIN_SAMPLES: ${ADAPTIVE_MIN_SAMPLES:-1}
      ADAPTIVE_STALE_AFTER_SECONDS: ${ADAPTIVE_STALE_AFTER_SECONDS:-30}
      MODEL_MAP: ${MODEL_MAP:-gpt-proxy=bedrock:anthropic.claude-3-haiku-20240307-v1:0,vertex:gemini-1.5-flash;mock-small=mock:mock-small}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_SIMILARITY_THRESHOLD: ${CACHE_SIMILARITY_THRESHOLD:-0.90}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-1000}
      CACHE_EMBEDDING_PROVIDER: ${CACHE_EMBEDDING_PROVIDER:-hashing}
      CACHE_EMBEDDING_DIM: ${CACHE_EMBEDDING_DIM:-256}
      CACHE_INDEX_BACKEND: ${CACHE_INDEX_BACKEND:-auto}
      CACHE_ANN_TOP_K: ${CACHE_ANN_TOP_K:-25}
      CACHE_ANN_EF_RUNTIME: ${CACHE_ANN_EF_RUNTIME:-64}
      CACHE_MOCK_SAVINGS_USD: ${CACHE_MOCK_SAVINGS_USD:-0.002}
      BUDGET_ENABLED: ${BUDGET_ENABLED:-true}
      BUDGET_SOFT_RATIO: ${BUDGET_SOFT_RATIO:-0.8}
      BUDGET_HARD_STATUS: ${BUDGET_HARD_STATUS:-402}
      BUDGET_MOCK_USD: ${BUDGET_MOCK_USD:-0.002}
      BUDGET_USD_PER_DAY: ${BUDGET_USD_PER_DAY:-10}
      BUDGET_USD_PER_MONTH: ${BUDGET_USD_PER_MONTH:-100}
      BUDGET_TOKENS_PER_DAY: ${BUDGET_TOKENS_PER_DAY:-1000000}
      BUDGET_TOKENS_PER_MONTH: ${BUDGET_TOKENS_PER_MONTH:-10000000}
      TENANT_BUDGETS: ${TENANT_BUDGETS:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_ROUTER:-router}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
      # Optional cloud credentials (only when PROVIDER_MODE is bedrock/vertex/multi)
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      # To use a mounted SA JSON locally, add a volume and set:
      # GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp.json
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  gateway:
    build:
      context: ./apps/gateway
    ports:
      - "${GATEWAY_HOST_PORT:-18080}:8080"
    environment:
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-key-change-me}
      TENANT_API_KEYS: ${TENANT_API_KEYS:-}
      ROUTER_URL: ${ROUTER_URL:-http://router:8081}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-262144}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_KEY_QPS: ${RATE_LIMIT_KEY_QPS:-10}
      RATE_LIMIT_KEY_BURST: ${RATE_LIMIT_KEY_BURST:-20}
      RATE_LIMIT_TENANT_QPS: ${RATE_LIMIT_TENANT_QPS:-}
      RATE_LIMIT_TENANT_BURST: ${RATE_LIMIT_TENANT_BURST:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_GATEWAY:-gateway}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
    depends_on:
      redis:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    ports:
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      gateway:
        condition: service_healthy
      router:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    ports:
      - "${GRAFANA_HOST_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["monitoring"]
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # OTLP HTTP is available inside the compose network at http://jaeger:4318
    # Point gateway/router at it via OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
