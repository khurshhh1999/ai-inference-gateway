name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router:
    name: Router lint + unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -q

  gateway:
    name: Gateway unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/gateway/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [router, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up --build -d redis router gateway
      - name: Wait for health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null \
              && curl -sf http://127.0.0.1:18081/health >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Chat completion + metrics
        run: |
          set -euo pipefail
          # Avoid `curl | grep -q` under pipefail: grep exits early on match and
          # curl gets SIGPIPE (exit 23), failing the step even when grep matched.
          curl -sD /tmp/headers.txt -o /tmp/completion.json \
            http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: demo-key-change-me' \
            -H 'X-Request-Id: ci-smoke-req-001' \
            -d '{"model":"mock-small","messages":[{"role":"user","content":"ci smoke"}]}'
          grep -q '"provider"' /tmp/completion.json
          grep -qi 'x-request-id: ci-smoke-req-001' /tmp/headers.txt
          curl -sf http://127.0.0.1:18080/metrics -o /tmp/gateway-metrics.txt
          grep -q 'gateway_request_duration_seconds' /tmp/gateway-metrics.txt
          curl -sf http://127.0.0.1:18081/metrics -o /tmp/router-metrics.txt
          grep -q 'router_request_duration_seconds' /tmp/router-metrics.txt
          curl -sf http://127.0.0.1:18080/openapi.json -o /tmp/openapi.json
          grep -q 'AI Inference Gateway' /tmp/openapi.json
          # Near-duplicate semantic cache hit (scan or RediSearch HNSW)
          curl -sS http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: demo-key-change-me' \
            -d '{"model":"mock-small","messages":[{"role":"user","content":"Explain semantic caching in one sentence."}]}' \
            -o /tmp/cache-miss.json
          grep -Eq '"cached": ?false' /tmp/cache-miss.json
          curl -sS http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: demo-key-change-me' \
            -d '{"model":"mock-small","messages":[{"role":"user","content":"Explain semantic caching in a single sentence."}]}' \
            -o /tmp/cache-hit.json
          grep -Eq '"cached": ?true' /tmp/cache-hit.json
          curl -sf http://127.0.0.1:18081/health -o /tmp/router-health.json
          grep -q 'index_backend' /tmp/router-health.json
          curl -sf http://127.0.0.1:18081/v1/cache/stats -o /tmp/cache-stats.json
          grep -q 'index_backend' /tmp/cache-stats.json
          # OpenAI-shaped models + embeddings through the gateway
          curl -sS http://127.0.0.1:18080/v1/models \
            -H 'X-API-Key: demo-key-change-me' \
            -H 'X-Request-Id: ci-smoke-models-001' \
            -o /tmp/models.json
          grep -q 'mock-small' /tmp/models.json
          grep -q 'text-embedding-3-small' /tmp/models.json
          curl -sS http://127.0.0.1:18080/v1/embeddings \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer demo-key-change-me' \
            -H 'X-Request-Id: ci-smoke-emb-001' \
            -d '{"model":"text-embedding-3-small","input":"ci smoke embeddings"}' \
            -o /tmp/embeddings.json
          grep -q '"object": "list"' /tmp/embeddings.json || grep -q '"object":"list"' /tmp/embeddings.json
          grep -q 'embedding' /tmp/embeddings.json
      - name: Tear down
        if: always()
        run: docker compose down -v
