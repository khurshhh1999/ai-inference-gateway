name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router:
    name: Router lint + unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -q

  gateway:
    name: Gateway unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/gateway/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [router, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up --build -d redis router gateway
      - name: Wait for health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null \
              && curl -sf http://127.0.0.1:18081/health >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Chat completion + metrics
        run: |
          set -euo pipefail
          curl -sD /tmp/headers.txt -o /tmp/completion.json \
            http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: demo-key-change-me' \
            -H 'X-Request-Id: ci-smoke-req-001' \
            -d '{"model":"mock-small","messages":[{"role":"user","content":"ci smoke"}]}'
          grep -q '"provider"' /tmp/completion.json
          grep -qi 'x-request-id: ci-smoke-req-001' /tmp/headers.txt
          curl -sf http://127.0.0.1:18080/metrics | grep -q 'gateway_request_duration_seconds'
          curl -sf http://127.0.0.1:18081/metrics | grep -q 'router_request_duration_seconds'
          curl -sf http://127.0.0.1:18080/openapi.json | grep -q 'AI Inference Gateway'
          # Near-duplicate semantic cache hit (scan or RediSearch HNSW)
          curl -sS http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: demo-key-change-me' \
            -d '{"model":"mock-small","messages":[{"role":"user","content":"Explain semantic caching in one sentence."}]}' \
            | grep -Eq '"cached": ?false'
          curl -sS http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: demo-key-change-me' \
            -d '{"model":"mock-small","messages":[{"role":"user","content":"Explain semantic caching in a single sentence."}]}' \
            | grep -Eq '"cached": ?true'
          curl -sf http://127.0.0.1:18081/health | grep -q 'index_backend'
          curl -sf http://127.0.0.1:18081/v1/cache/stats | grep -q 'index_backend'
      - name: Tear down
        if: always()
        run: docker compose down -v
